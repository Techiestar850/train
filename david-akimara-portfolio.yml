about:
  paragraphs:
    - >
      I'm David Akimara, a dental student in Nairobi, currently working
      through the clinical and pre-clinical curriculum alongside the
      professional and legal frameworks that govern dental practice in Kenya.
    - >
      My long-term direction is an MDS in Oral & Maxillofacial Surgery,
      aimed at oral oncology and head and neck oncologic surgery — most
      likely with fellowship training taken up abroad after the Kenyan
      pathway.
    - >
      Alongside that, I follow nanodentistry as a research interest: how
      nanoscale materials and delivery systems might change restorative and
      diagnostic dentistry over the next decade. I also keep a running
      interest in applied technology — AI in healthcare, and where
      computing tools intersect with clinical work.

focus_areas:
  - tag: Clinical pathway
    title: Oral & maxillofacial oncology
    description: >
      Working toward an MDS in OMFS, with a focus narrowing toward head
      and neck oncologic surgery and the surgical management of oral
      cancers.
  - tag: Research interest
    title: Nanodentistry
    description: >
      Studying nanoscale materials and delivery systems in dentistry —
      from self-study resources to formal certificate pathways — as a
      future research area.
  - tag: Applied technology
    title: Health tech & AI
    description: >
      Following how AI and computing tools are being applied in
      healthcare, and thinking through where those tools are useful — and
      where they aren't — in clinical practice.

